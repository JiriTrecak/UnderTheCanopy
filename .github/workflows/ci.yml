# Builds, lints, tests and packages the game on macOS (Apple Silicon) and Windows.
# Checkouts skip Git LFS: GitHub bills LFS bandwidth, and nothing here needs art.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package: app
          - os: windows-latest
            package: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Package
        run: cargo packager -p canopy --release --formats ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: canopy-${{ runner.os }}
          path: |
            target/release/*.app
            target/release/*-setup.exe
          if-no-files-found: error
