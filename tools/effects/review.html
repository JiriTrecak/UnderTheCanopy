<title>Spell Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* A review bench like the icon review: the neutral zinc stage (the project's preview rule), the spells the only colour; one card per spell, its clips in the order the spell happens, one verdict per card. */
:root {
  color-scheme: dark;
  --stage: #18181b; --panel: #27272a; --line: #52525b; --slot: #0f0f11;
  --text: #e4e4e7; --dim: #a1a1aa; --faint: #71717a;
  --yay: #7fbf8a; --yay-bg: #7fbf8a22; --nay: #e0806a; --nay-bg: #e0806a22; --gold: #d9c27a;
  --display: 'Spectral', Georgia, serif;
  --body: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
body { background: var(--stage); color: var(--text); font: 14px/1.5 var(--body); margin: 0; }
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; }
h1 { font: 600 28px/1.2 var(--display); margin: 0; text-wrap: balance; }
.lede { color: var(--dim); margin: 4px 0 0; max-width: 72ch; }
.tally { display: flex; gap: 16px; font-variant-numeric: tabular-nums; color: var(--dim); }
.tally b { color: var(--text); font-weight: 600; }
.tally .y b { color: var(--yay); } .tally .n b { color: var(--nay); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--stage); padding-block: 12px; margin-top: 8px; border-bottom: 1px solid var(--panel); display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-right: 4px; min-width: 56px; }
.chip { font: 500 13px/1 var(--body); color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; cursor: pointer; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--stage); border-color: var(--text); }
.chip:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.chip .count { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
input[type=search] { font: 14px var(--body); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; width: 220px; max-width: 100%; }
.notice { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; color: var(--dim); }
.list { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; }
.card.yay { border-color: var(--yay); } .card.nay { border-color: var(--nay); }
.head { display: flex; gap: 12px; align-items: flex-start; }
.icon { width: 64px; height: 64px; border-radius: 3px; background: var(--slot); flex: none; }
.titles { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font: 600 18px/1.25 var(--display); margin: 0; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.tag.again { color: var(--nay); border-color: #e0806a66; }
.does { font-size: 13px; color: var(--dim); margin: 8px 0 0; max-width: 90ch; }
.clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
figure img { width: 100%; aspect-ratio: 8 / 5; max-width: 100%; object-fit: cover; border-radius: 4px; background: var(--slot); display: block; }
figcaption { font-size: 12px; color: var(--dim); }
figcaption b { color: var(--text); font-weight: 500; }
figcaption .event { font: 11px var(--mono); color: var(--gold); text-transform: none; margin-right: 6px; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.vote { display: flex; gap: 6px; }
.vote button { flex: 1; font: 600 13px/1 var(--body); padding: 9px 6px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; }
.vote button:disabled { cursor: not-allowed; opacity: .5; }
.vote .y[aria-pressed="true"] { background: var(--yay-bg); color: var(--yay); border-color: var(--yay); }
.vote .n[aria-pressed="true"] { background: var(--nay-bg); color: var(--nay); border-color: var(--nay); }
textarea { font: 13px/1.4 var(--body); color: var(--text); background: var(--stage); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; resize: vertical; min-height: 72px; width: 100%; box-sizing: border-box; }
.saved { font-size: 11px; color: var(--faint); min-height: 14px; }
.id { font: 11px var(--mono); color: var(--faint); overflow-wrap: anywhere; }
.empty { color: var(--dim); padding: 32px 0; }
@media (max-width: 760px) { .card { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Spell Review</h1>
      <p class="lede">Every ability in the game and the effects it plays, in the order they happen, each looping at game speed on open sand. Yay keeps the look; Nay sends it back to be rebuilt, with your comment as the brief. A rebuilt spell asks for a new vote.</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>
  <div class="bar">
    <div class="chips" id="f-status"><span class="label">Show</span></div>
    <div class="chips" id="f-race"><span class="label">Race</span><input type="search" id="q" placeholder="Find a spell or caster" aria-label="Find a spell or caster"></div>
  </div>
  <p class="notice" id="notice" hidden></p>
  <div class="list" id="list"><p class="empty">Loading the spells…</p></div>
</div>
<script>
const state = { spells: [], reviews: {}, status: 'todo', race: 'All', q: '', db: null, writable: true };
const STATUSES = [['todo', 'To review'], ['nay', 'Nay'], ['yay', 'Yay'], ['all', 'All']];
const RACES = ['All', 'Ants', 'Beetles', 'Neutral'];
const EVENTS = { accepted: 'wind-up', released: 'release', projectile: 'flight', impact: 'impact', summoned: 'summon',
  statusApplied: 'on the unit', healed: 'heal', damaged: 'each hit', enhancedHit: 'enhanced hit', interval: 'pulse' };
const pending = {};

function verdictOf(spell) {
  const r = state.reviews[spell.id];
  if (!r || !r.verdict) return { verdict: null, again: !!(r && r.version && r.version !== spell.version && r.verdict), comment: r ? r.comment || '' : '' };
  if (r.version !== spell.version) return { verdict: null, again: true, comment: r.comment || '' };
  return { verdict: r.verdict, again: false, comment: r.comment || '' };
}

function visible() {
  const q = state.q.trim().toLowerCase();
  return state.spells.filter(s => {
    const v = verdictOf(s).verdict;
    if (state.status === 'todo' && v) return false;
    if (state.status === 'yay' && v !== 'yay') return false;
    if (state.status === 'nay' && v !== 'nay') return false;
    if (state.race !== 'All' && s.race !== state.race) return false;
    if (q && !(s.name + ' ' + s.id + ' ' + s.casters.join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function chipRow(el, options, key, counts) {
  el.querySelectorAll('.chip').forEach(c => c.remove());
  const search = el.querySelector('input');
  for (const opt of options) {
    const [value, label] = Array.isArray(opt) ? opt : [opt, opt];
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.setAttribute('aria-pressed', String(state[key] === value));
    b.textContent = label;
    if (counts && counts[value] !== undefined) { const s = document.createElement('span'); s.className = 'count'; s.textContent = counts[value]; b.append(s); }
    b.addEventListener('click', () => { state[key] = value; render(); });
    el.insertBefore(b, search || null);
  }
}

function renderBars() {
  const c = { todo: 0, nay: 0, yay: 0, all: state.spells.length };
  for (const s of state.spells) { const v = verdictOf(s).verdict; c[v || 'todo']++; }
  chipRow(document.getElementById('f-status'), STATUSES, 'status', c);
  chipRow(document.getElementById('f-race'), RACES, 'race');
  const t = document.getElementById('tally');
  t.innerHTML = '';
  for (const [cls, n, label] of [['y', c.yay, 'yay'], ['n', c.nay, 'nay'], ['', c.todo, 'to review']]) {
    const s = document.createElement('span'); s.className = cls;
    const b = document.createElement('b'); b.textContent = n; s.append(b, ' ' + label); t.append(s);
  }
}

function card(spell) {
  const v = verdictOf(spell);
  const el = document.createElement('article');
  el.className = 'card' + (v.verdict ? ' ' + v.verdict : '');
  const main = document.createElement('div');
  const head = document.createElement('div'); head.className = 'head';
  if (spell.icon) { const i = new Image(64, 64); i.className = 'icon'; i.src = spell.icon + '?v=' + spell.version; i.alt = ''; head.append(i); }
  const titles = document.createElement('div'); titles.className = 'titles';
  const h = document.createElement('h2'); h.className = 'name'; h.textContent = spell.name;
  const meta = document.createElement('div'); meta.className = 'meta';
  for (const t of [spell.race, spell.casters.join(', ') || 'no caster', spell.passive ? 'passive' : '']) {
    if (!t) continue; const s = document.createElement('span'); s.textContent = t; meta.append(s);
  }
  if (v.again) { const s = document.createElement('span'); s.className = 'tag again'; s.textContent = 'rebuilt: vote again'; meta.append(s); }
  titles.append(h, meta); head.append(titles);
  const does = document.createElement('p'); does.className = 'does'; does.textContent = spell.does;
  const clips = document.createElement('div'); clips.className = 'clips';
  for (const e of spell.effects) {
    const f = document.createElement('figure');
    const img = new Image(); img.loading = 'lazy'; img.src = e.media + '?v=' + e.version; img.alt = e.name + ': ' + e.about;
    const cap = document.createElement('figcaption');
    const ev = document.createElement('span'); ev.className = 'event'; ev.textContent = EVENTS[e.event] || e.event;
    const b = document.createElement('b'); b.textContent = e.name;
    cap.append(ev, b);
    if (e.about) cap.append(' · ' + e.about);
    f.append(img, cap); clips.append(f);
  }
  main.append(head, does, clips);
  const side = document.createElement('div'); side.className = 'side';
  const vote = document.createElement('div'); vote.className = 'vote';
  const yay = document.createElement('button'); yay.type = 'button'; yay.className = 'y'; yay.textContent = 'Yay';
  const nay = document.createElement('button'); nay.type = 'button'; nay.className = 'n'; nay.textContent = 'Nay: rebuild';
  yay.setAttribute('aria-pressed', String(v.verdict === 'yay')); nay.setAttribute('aria-pressed', String(v.verdict === 'nay'));
  yay.disabled = nay.disabled = !state.db || !state.writable;
  const note = document.createElement('textarea'); note.id = 'c-' + spell.id.replace(/[^a-z0-9-]/gi, '-');
  note.placeholder = 'What should it look like instead?'; note.value = v.comment; note.rows = 3; note.disabled = !state.db || !state.writable;
  note.setAttribute('aria-label', 'Comment on ' + spell.name);
  const saved = document.createElement('div'); saved.className = 'saved';
  yay.addEventListener('click', () => save(spell, { verdict: v.verdict === 'yay' ? null : 'yay', comment: note.value }, saved));
  nay.addEventListener('click', () => save(spell, { verdict: v.verdict === 'nay' ? null : 'nay', comment: note.value }, saved));
  let timer;
  const flush = () => { clearTimeout(timer); const r = state.reviews[spell.id] || {}; if ((r.comment || '') !== note.value) save(spell, { verdict: verdictOf(spell).verdict, comment: note.value }, saved); };
  note.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(flush, 1200); });
  note.addEventListener('blur', flush);
  const id = document.createElement('div'); id.className = 'id'; id.textContent = spell.id;
  vote.append(yay, nay);
  side.append(vote, note, saved, id);
  el.append(main, side);
  return el;
}

function save(spell, { verdict, comment }, saved) {
  if (!state.db) return;
  const body = { version: spell.version, verdict: verdict || null, comment: comment || '', updatedAt: new Date().toISOString() };
  state.reviews[spell.id] = body;
  saved.textContent = 'Saving…';
  const ref = state.db.collection('reviews').doc(spell.id);
  pending[spell.id] = (pending[spell.id] || Promise.resolve()).then(() => ref.set(body)).then(
    () => { saved.textContent = 'Saved'; },
    e => {
      saved.textContent = e && e.code === 'invalid_argument' ? 'Not saved: this view can only read the votes.' : 'Not saved: ' + (e && e.message || 'try again');
      if (e && e.code === 'invalid_argument') { state.writable = false; render(); }
    });
  if (verdict !== undefined) renderSoon();
}

let soon;
function renderSoon() { clearTimeout(soon); soon = setTimeout(render, 250); }

function render() {
  renderBars();
  const list = document.getElementById('list');
  const shown = visible();
  const focused = document.activeElement && document.activeElement.id;
  list.innerHTML = '';
  if (!shown.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = state.spells.length ? 'No spells match these filters.' : 'No spells yet.'; list.append(p); return; }
  for (const s of shown) list.append(card(s));
  if (focused && focused.startsWith('c-')) { const el = document.getElementById(focused); if (el) el.focus(); }
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });

async function start() {
  try {
    const res = await fetch('manifest.json');
    state.spells = (await res.json()).spells;
  } catch (e) {
    document.getElementById('list').innerHTML = '<p class="empty">The spell list could not be loaded.</p>';
    return;
  }
  render();
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  const notice = document.getElementById('notice');
  if (!db) { notice.hidden = false; notice.textContent = 'Votes cannot be saved in this view (sign in on claude.ai to vote). You can still watch every spell.'; render(); return; }
  state.db = db;
  render();
  db.collection('reviews').onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    for (const [k, v] of Object.entries(state.reviews)) if (pending[k] && !next[k]) next[k] = v;
    state.reviews = next;
    const active = document.activeElement;
    if (!(active && active.tagName === 'TEXTAREA')) render(); else renderBars();
  }, () => { notice.hidden = false; notice.textContent = 'Live votes stopped updating; reload the page to see the latest.'; });
}
start();
</script>
