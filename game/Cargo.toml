[package]
name = "canopy"
description = "Under the Canopy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "canopy"
path = "src/main.rs"

[features]
# Streams spans and frame marks to the Tracy profiler (`just profile`).
profile = ["dep:tracing-tracy"]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
canopy-assets = { path = "../crates/assets" }
canopy-audio = { path = "../crates/audio" }
canopy-content = { path = "../crates/content" }
canopy-net = { path = "../crates/net" }
canopy-render = { path = "../crates/render" }
canopy-scene = { path = "../crates/scene" }
canopy-sim = { path = "../crates/sim" }
canopy-ui = { path = "../crates/ui", features = ["wgpu", "winit"] }
directories.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
flate2.workspace = true
glam.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
# The spectate smoke test borrows the simulation's test-owned AI fixture.
canopy-content = { path = "../crates/content", features = ["testing"] }

[lints]
workspace = true

[package.metadata.packager]
product-name = "Under the Canopy"
# The old desktop app's identifier: updates replace it in place and keep its identity (D43).
identifier = "com.jiritrecak.settlers"
category = "StrategyGame"
# Cooks the asset pack first. CI checkouts have no Git LFS art, so sources that are LFS
# pointers are left out of the pack (with a warning) instead of failing the package.
before-packaging-command = "cargo run --release -p canopy-cook -- --allow-lfs-pointers && cargo build --release -p canopy"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
# Game data ships in `data/`: `Contents/Resources/data` on macOS, beside the executable on Windows.
# The simulation reads content/, the asset indexes and the maps as JSON; every binary asset
# ships cooked in canopy.pack instead of assets/library.
resources = [
    { src = "../content", target = "data/content" },
    { src = "../assets/manifest.json", target = "data/assets/manifest.json" },
    { src = "../assets/authoring/catalogue.json", target = "data/assets/authoring/catalogue.json" },
    { src = "../assets/authoring/models.json", target = "data/assets/authoring/models.json" },
    { src = "../assets/maps", target = "data/assets/maps" },
    { src = "../config", target = "data/config" },
    { src = "../target/cooked/canopy.pack", target = "data/canopy.pack" },
]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
