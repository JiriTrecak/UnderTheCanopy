[package]
name = "canopy"
description = "Under the Canopy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "canopy"
path = "src/main.rs"

[features]
# Streams spans and frame marks to the Tracy profiler (`just profile`).
profile = ["dep:tracing-tracy"]

[dependencies]
anyhow.workspace = true
directories.workspace = true
pollster.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
wgpu.workspace = true
winit.workspace = true

[lints]
workspace = true

[package.metadata.packager]
product-name = "Under the Canopy"
identifier = "com.jt.canopy"
category = "StrategyGame"
before-packaging-command = "cargo build --release -p canopy"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
# Game data ships in `data/`: `Contents/Resources/data` on macOS, beside the executable on Windows.
resources = [{ src = "../content", target = "data/content" }]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
