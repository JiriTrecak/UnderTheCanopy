[workspace]
resolver = "3"
members = ["crates/*", "game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
anyhow = "1"
directories = "6"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_with = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = "0.12"
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (wgpu, naga, winit) are slow when unoptimised; our own code stays debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.profiling]
# Release speed with full symbols, for Tracy and Instruments.
inherits = "release"
debug = true
