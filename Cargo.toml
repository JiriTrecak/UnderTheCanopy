[workspace]
resolver = "3"
members = ["crates/*", "game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
anyhow = "1"
# The system clipboard for text fields (copy, cut, paste).
arboard = { version = "3", default-features = false }
# Tests that the mixer never allocates while rendering.
assert_no_alloc = { version = "1.1", features = ["warn_debug"] }
blake3 = "1"
block_compression = { version = "0.10", default-features = false, features = ["bc7"] }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
# UI text: shaping, layout and rasterising (swash); no fontconfig, fonts are passed in.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
directories = "6"
# The debug overlay only (renderer §6): egui with its wgpu pass and winit input.
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
etagere = "0.3"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
glam = { version = "0.30", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "KHR_materials_specular", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
hound = "3"
intel_tex_2 = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Audio playback (cpal backend only: sounds arrive as PCM from the pack, nothing is decoded).
kira = { version = "0.12", default-features = false, features = ["cpal"] }
libm = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
pollster = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_with = "3"
sha2 = "0.11"
# UI layout (flexbox and grid); `parse` reads CSS values from the layout files.
taffy = { version = "0.15", features = ["parse"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = "0.12"
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (wgpu, naga, winit) are slow when unoptimised; our own code stays debuggable.
opt-level = 2

[profile.dev.package.canopy-cook]
# The cooker's own loops (mips, quantisation, baking) run over hundreds of megapixels.
opt-level = 2

[profile.dev.package.canopy-sim]
# `just play --spectate` runs the simulation in real time: 25 ms ticks need it optimised.
opt-level = 2

[profile.dev.package.canopy-scene]
# Presents every simulation tick on the simulation thread.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.profiling]
# Release speed with full symbols, for Tracy and Instruments.
inherits = "release"
debug = true
