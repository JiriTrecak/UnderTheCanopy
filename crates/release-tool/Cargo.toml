[package]
name = "canopy-release-tool"
description = "The release tool (`just release-*`): notes, preparing, building, signing and publishing releases (D43)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "canopy-release"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
canopy-release = { path = "../release" }
directories.workspace = true
flate2.workspace = true
minisign.workspace = true
# Public CDN checks after uploading (blocking: the tool is a plain command-line program).
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true
