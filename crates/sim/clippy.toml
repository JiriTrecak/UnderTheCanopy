# Determinism (docs/decisions.md D4, docs/simulation.md "Numbers").
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::cos", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::tan", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::sin_cos", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::atan", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::atan2", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::asin", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::acos", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::hypot", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::powf", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::exp", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::ln", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::log10", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::log2", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f64::mul_add", reason = "fused results differ from separate operations" },
    { path = "f32::sin", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f32::cos", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f32::atan2", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f32::hypot", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f32::powf", reason = "platform libm differs; use canopy_sim::math" },
    { path = "f32::mul_add", reason = "fused results differ from separate operations" },
    { path = "std::time::Instant::now", reason = "the simulation has no clock" },
    { path = "std::time::SystemTime::now", reason = "the simulation has no clock" },
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is unspecified; use BTreeMap or an id-indexed table" },
    { path = "std::collections::HashSet", reason = "iteration order is unspecified; use BTreeSet or a sorted Vec" },
]
