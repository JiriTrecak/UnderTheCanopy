<svg xmlns="http://www.w3.org/2000/svg" width="720" height="575" viewBox="0 0 720 575" role="img" aria-labelledby="title desc"><title id="title">An attack has an authoritative moment</title><desc id="desc">A conceptual attack timeline: cancellable windup, contact or release, then recovery. A released arrow has a separate later impact. Durations are not to scale.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#40584b" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#9fc77b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#15211e"/><g font-family="system-ui, sans-serif"><text x="32" y="45" font-size="19" fill="#edc37d" font-weight="600" text-anchor="start">MAKE THE SWING AND THE DAMAGE AGREE</text><text x="32" y="95" font-size="28" fill="#eef0da" font-weight="650" text-anchor="start">One authoritative attack cycle</text><rect x="36" y="145" width="265" height="76" rx="9" fill="#755847"/><rect x="307" y="145" width="377" height="76" rx="9" fill="#1e302a"/><text x="168" y="190" font-size="24" fill="#edc37d" font-weight="650" text-anchor="middle">WINDUP</text><text x="497" y="190" font-size="24" fill="#afc1ae" font-weight="650" text-anchor="middle">RECOVERY</text><path d="M305 125V250" fill="none" stroke="#9fc77b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="305" cy="145" r="8" fill="#9fc77b" stroke="#15211e" stroke-width="2"/><text x="32" y="271" font-size="22" fill="#afc1ae" font-weight="400" text-anchor="start">New order: cancel</text><text x="334" y="271" font-size="22" fill="#afc1ae" font-weight="400" text-anchor="start">New order: leave recovery</text><text x="305" y="318" font-size="24" fill="#9fc77b" font-weight="700" text-anchor="middle">CONTACT / RELEASE</text><path d="M305 330V362L143 390" fill="none" stroke="#9fc77b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M305 330V362L513 390" fill="none" stroke="#8ec9d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="389" width="252" height="110" rx="10" fill="#1e302a"/><rect x="330" y="389" width="354" height="110" rx="10" fill="#1e302a"/><text x="56" y="425" font-size="20" fill="#edc37d" font-weight="600" text-anchor="start">MELEE</text><text x="56" y="464" font-size="22" fill="#eef0da" font-weight="400" text-anchor="start">Check the hit now</text><text x="350" y="425" font-size="20" fill="#8ec9d0" font-weight="600" text-anchor="start">ARROW</text><text x="350" y="464" font-size="22" fill="#eef0da" font-weight="400" text-anchor="start">Launch → flight → impact</text><text x="32" y="544" font-size="20" fill="#afc1ae" font-weight="400" text-anchor="start">Animation follows this timeline. Durations are schematic.</text></g></svg>