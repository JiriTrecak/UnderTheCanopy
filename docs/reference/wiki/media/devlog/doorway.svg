<svg xmlns="http://www.w3.org/2000/svg" width="720" height="565" viewBox="0 0 720 565" role="img" aria-labelledby="title desc"><title id="title">Who has room to step aside?</title><desc id="desc">An illustrative narrow doorway. A stands outside the doorway and can reach a pocket; B is inside and C blocks its retreat. A yields without losing its original order.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#40584b" stroke-width=".6" opacity=".4"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#9fc77b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#15211e"/><g font-family="system-ui, sans-serif"><text x="32" y="44" font-size="19" fill="#edc37d" font-weight="600" text-anchor="start">A DOORWAY NEEDS A TRAFFIC AGREEMENT</text><rect x="24" y="76" width="672" height="370" rx="12" fill="#1e302a"/><rect x="24" y="76" width="672" height="370" fill="url(#grid)"/><rect x="340" y="76" width="46" height="155" fill="#687665"/><path d="M342 76H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 100H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 124H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 148H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 172H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 196H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="307" width="46" height="139" fill="#687665"/><path d="M342 307H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 331H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 355H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 379H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 403H384" fill="none" stroke="#87917d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 268H618" fill="none" stroke="#93a996" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><path d="M280 262Q258 260 247 232L214 173" fill="none" stroke="#9fc77b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="214" cy="154" r="26" fill="none" stroke="#9fc77b" stroke-width="3" stroke-dasharray="5 5"/><text x="88" y="117" font-size="22" fill="#9fc77b" font-weight="600" text-anchor="start">A reachable pocket</text><path d="M243 139L284 115" fill="none" stroke="#9fc77b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 298H259" fill="none" stroke="#9fc77b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="413" y="343" font-size="22" fill="#9fc77b" font-weight="400" text-anchor="start">B can pass</text><circle cx="293" cy="268" r="22" fill="#c76b52" stroke="#15211e" stroke-width="2"/><text x="293" y="276" font-size="22" fill="#15211e" font-weight="700" text-anchor="middle">A</text><circle cx="365" cy="268" r="22" fill="#edc37d" stroke="#15211e" stroke-width="2"/><text x="365" y="276" font-size="22" fill="#15211e" font-weight="700" text-anchor="middle">B</text><circle cx="443" cy="268" r="22" fill="#edc37d" stroke="#15211e" stroke-width="2"/><text x="443" y="276" font-size="22" fill="#15211e" font-weight="700" text-anchor="middle">C</text><text x="76" y="404" font-size="23" fill="#eef0da" font-weight="600" text-anchor="start">A keeps its original destination.</text><text x="32" y="487" font-size="23" fill="#eef0da" font-weight="600" text-anchor="start">Choose an escape the unit can actually reach.</text><text x="32" y="524" font-size="22" fill="#afc1ae" font-weight="400" text-anchor="start">Terrain + bodies + reservations still apply.</text></g></svg>