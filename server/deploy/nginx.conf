# Installed as /etc/nginx/sites-enabled/canopy-matchhost.
# HTTP only serves ACME challenges; all game traffic requires TLS.
map $http_upgrade $canopy_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 18.134.138.1;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/canopy-acme;
    }
    location / { return 308 https://18.134.138.1$request_uri; }
}

server {
    listen 443 ssl;
    server_name 18.134.138.1;
    ssl_certificate /etc/letsencrypt/live/canopy-matchhost/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canopy-matchhost/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CanopyTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 32m;

    # WebSocket query strings contain lobby tokens; never write them to access logs.
    access_log off;
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
    # Feedback carries one screenshot (at most 2 MB, base64 in JSON).
    location = /api/feedback {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /match/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $canopy_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { return 404; }
}
